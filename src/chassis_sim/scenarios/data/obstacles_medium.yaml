# planning 场景（stage 1，requires: planning）：obstacles_medium
# 中等密度障碍（stage 1）：count [5,9]、obstacle_spacing 0.8、
# position_margin 1.1、start_goal_clearance 0.85
#
# 地图本体不落进 YAML：obstacles 故意留空、path.type=stage 只声明"取哪个 stage"，
# 真正的障碍与参考路径由 chassis_sim.planning.MapGenerator 现场生成（依赖 numba，属
# [planning] extra）。world_bounds 作为生成区域传给 MapGenerator。
name: obstacles_medium
description: 中等密度障碍（课程 stage 1）—— 障碍与参考路径由 MapGenerator 现场生成
world_bounds: [0.0, 10.0, 0.0, 10.0]
obstacles: []
path:
  type: stage
  params:
    stage: obstacles_medium
seed: 0
requires: planning
