# planning 场景（stage 0，requires: planning）：obstacles_sparse
# 稀疏静态障碍（curriculum.yaml 的 stage 0）：count [2,5]、圆 r [0.2,0.5]、
# 矩形 0.5x0.2 ~ 1.5x0.6、obstacle_spacing 1.0、position_margin 1.2、
# start_goal_clearance 1.0
#
# 地图本体不落进 YAML：obstacles 故意留空、path.type=stage 只声明"取哪个 stage"，
# 真正的障碍与参考路径由 chassis_sim.planning.MapGenerator 现场生成（依赖 numba，属
# [planning] extra）。world_bounds 作为生成区域传给 MapGenerator。
name: obstacles_sparse
description: 稀疏静态障碍（课程 stage 0）—— 障碍与参考路径由 MapGenerator 现场生成
world_bounds: [0.0, 10.0, 0.0, 10.0]
obstacles: []
path:
  type: stage
  params:
    stage: obstacles_sparse
seed: 0
requires: planning
