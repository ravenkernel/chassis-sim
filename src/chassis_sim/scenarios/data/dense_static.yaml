# core 场景 4/4：静态密集（不需要 numba）。
# 14 个圆/矩形贴着折线参考路径排布：每个障碍的**边界**到参考路径至少 0.30 m
# （实测最小 0.35 m）⇒ 沿路径留出可通行缝，而横向可用空间被压到 0.6~1.0 m。
# 起点 (1,1.5) 与终点 (9,8.5) 到最近障碍边界的距离都 >= 0.6 m，reset 不会压障。
name: dense_static
description: 静态密集 — 14 个圆/矩形贴参考路径排布，沿路径留出可通行缝
world_bounds: [0.0, 10.0, 0.0, 10.0]
obstacles:
  - type: circle
    x: 1.600
    y: 2.900
    radius: 0.350
  - type: rectangle
    x: 2.600
    y: 1.000
    length: 0.900
    width: 0.300
    theta: 0.300
  - type: circle
    x: 3.000
    y: 4.600
    radius: 0.450
  - type: circle
    x: 4.300
    y: 2.600
    radius: 0.300
  - type: rectangle
    x: 4.600
    y: 5.900
    length: 0.800
    width: 0.350
    theta: -0.400
  - type: circle
    x: 5.600
    y: 3.400
    radius: 0.400
  - type: rectangle
    x: 6.800
    y: 4.900
    length: 1.000
    width: 0.400
    theta: 0.500
  - type: circle
    x: 7.000
    y: 8.200
    radius: 0.350
  - type: circle
    x: 8.300
    y: 6.700
    radius: 0.300
  - type: rectangle
    x: 2.000
    y: 6.500
    length: 0.800
    width: 0.400
    theta: 0.200
  - type: circle
    x: 8.600
    y: 3.000
    radius: 0.450
  - type: rectangle
    x: 5.000
    y: 7.600
    length: 1.200
    width: 0.300
  - type: circle
    x: 3.800
    y: 0.800
    radius: 0.250
  - type: rectangle
    x: 0.600
    y: 4.500
    length: 0.600
    width: 0.500
path:
  type: waypoints
  params:
    spacing: 0.05
    points:
      - [1.000, 1.500]
      - [2.500, 2.000]
      - [3.500, 3.800]
      - [5.000, 4.600]
      - [6.200, 6.200]
      - [7.500, 7.000]
      - [9.000, 8.500]
seed: 0
requires: null
