# planning 场景（stage 3，requires: planning）：obstacles_dense_reverse
# 密集障碍 + 倒车段（stage 3）：count [8,14]、obstacle_spacing 0.65、
# reverse_probability 0.4（40% 起步倒车）、path_reverse_probability 0.2（整条路径翻转）
#
# 地图本体不落进 YAML：obstacles 故意留空、path.type=stage 只声明"取哪个 stage"，
# 真正的障碍与参考路径由 chassis_sim.planning.MapGenerator 现场生成（依赖 numba，属
# [planning] extra）。world_bounds 作为生成区域传给 MapGenerator。
name: obstacles_dense_reverse
description: 密集障碍 + 倒车段（课程 stage 3）—— 由 MapGenerator 现场生成
world_bounds: [0.0, 10.0, 0.0, 10.0]
obstacles: []
path:
  type: stage
  params:
    stage: obstacles_dense_reverse
seed: 0
requires: planning
