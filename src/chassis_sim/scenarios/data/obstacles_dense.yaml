# planning 场景（stage 2，requires: planning）：obstacles_dense
# 密集静态障碍（stage 2，主收敛目标）：count [9,15]、obstacle_spacing 0.65、
# position_margin 1.0、start_goal_clearance 0.7、max_iterations 4000
#
# 地图本体不落进 YAML：obstacles 故意留空、path.type=stage 只声明"取哪个 stage"，
