# [planning] extra）。world_bounds 作为生成区域传给 MapGenerator。
name: obstacles_dense
description: 密集静态障碍（课程 stage 2，主收敛目标）—— 由 MapGenerator 现场生成
world_bounds: [0.0, 10.0, 0.0, 10.0]
obstacles: []
path:
  type: stage
  params:
    stage: obstacles_dense
seed: 0
requires: planning
