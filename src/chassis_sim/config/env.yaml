world:
  height: 10
  width: 10
  step_time: 0.1    # 10Hz
  sample_time: 0.1
  offset: [0, 0]
  control_mode: "auto"
  collision_mode: "stop"

robot:
  kinematics: {name: 'acker'}
  shape: {name: 'rectangle', length: 0.38, width: 0.2, wheelbase: 0.145}
  state: [1, 1, 0, 0]       # Placeholder — overridden by MapGenerator
  goal: [9, 9, 0]           # Placeholder — overridden by MapGenerator
  color: 'b'
  vel_dim: 2
  vel_min: [-1, -1]      # [v_min, steer_min] — 宽松于 train.yaml v_min=-0.6，防止 ir-sim 裁剪动作映射
  vel_max: [2, 1]        # [v_max, steer_max] — 宽松于 train.yaml v_max=1.3，防止 ir-sim 裁剪动作映射

  # ── 动力学三级开关（2026-11-04；语义与标定依据见 src/chassis_sim/envs/dynamics.py）──
  # 挂在 robot 段下而不是新增顶层键：env.yaml 的顶层键必须保持 {world, robot}（与主仓
  # 一致，见 tests/test_envs_config.py 的 TestPackagedYaml）。
  #   level: none   纯运动学（默认）。与加入本开关前逐位相同：dynamics.py 连 import 都不发生
  #          limits 加速度/转角速率硬限幅（|Δv| ≤ accel_max·dt，|Δδ| ≤ steer_rate_max·dt）
  #          wheel  limits + 执行器一阶滞后 + 死区 + 轮滑
  # 构造器 dynamics= 可覆盖本段 level（其余参数仍取本段）；显式传 "none" 时本段的
  # accel_max / steer_rate_max 也不再生效（none 档是纯运动学，见 ChassisSimEnv 注释）。
  # 三个默认值（0 = 未显式配置）与 dataclass 默认值逐位相同，否则 load_default_config()
  # 就不再等于 EnvConfig()（tests/test_envs_config.py 的 test_equals_dataclass_defaults）。
  dynamics:
    level: "none"
    accel_max: 0.0        # m/s²；0 ⇒ limits/wheel 档用 1.5（none 档不看它）
    steer_rate_max: 0.0   # rad/s；0 ⇒ limits/wheel 档用 3.0（none 档不看它）
    v_tau: 0.15           # s；速度一阶滞后（仅 wheel 档）
    omega_tau: 0.10       # s；角速度一阶滞后（仅 wheel 档）
    v_deadband: 0.0       # m/s；|v_cmd| 低于此值时输出归零（0 = 关，仅 wheel 档）
    wheel_slip: 0.0       # 轮滑系数 ∈[0,1)；地速 = 轮速×(1−slip)（0 = 关，仅 wheel 档）

  sensors:
    - type: 'lidar2d'
      range_max: 10.0
      angle_range: 3.1415926   # 180 deg in radians
      number: 180
      offset: [0.145, 0, 0]     # 安装在车头
    - type: 'lidar2d'
      range_max: 10.0
      angle_range: 3.1415926   # 180 deg in radians
      number: 180
      offset: [-0.155, 0, 3.1415926]   # 车尾, theta=π 朝向后方
