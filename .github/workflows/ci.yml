name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 全量：render（matplotlib）与规划（numba）都真跑，缺依赖不允许悄悄变 skip。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,planning]"
      - name: Test
        run: pytest -q

  # 核心安装（只 dev，没有 matplotlib / numba）：证明 pip install chassis-sim
  # 的用户不会红。render 四模块应 importorskip 掉，planning 走容差档；
  # 闸门就是 pytest 的退出码 —— skip 不算失败，failed 一定让这一步红。
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core only, 无 viz / 无 planning)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
