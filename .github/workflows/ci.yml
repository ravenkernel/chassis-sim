name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 全量：render（matplotlib）与规划（numba）都真跑，缺依赖不允许悄悄变 skip。
  #
  # NumPy 两档：pyproject 只声明 numpy>=1.24（没有上界），而 numba 从 0.60.0
  # 起才提供 NumPy 2 的二进制支持 ⇒ 用户装到的 numpy 可能是 1.x 也可能是 2.x。
  # 两档都真跑一遍，"numpy>=1.24" 才不是一句只写在元数据里的声明。
  #
  # 3.13 × numpy<2 显式排除：cp313 的 NumPy 轮子从 2.1.0 才开始，numpy<2
  # 在 3.13 上根本装不出来（实测 pip download --python-version 3.13 "numpy<2"
  # → No matching distribution found），留着这一格只会是解析失败而不是测试结论。
  # 3.13 本身不排除：numba 0.61.0 起有 cp313 轮子，numpy>=2 档可以真跑。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy: ["numpy<2", "numpy>=2"]
        exclude:
          - python-version: "3.13"
            numpy: "numpy<2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # 档位与 extras 必须在同一条命令里解析：分两步装的话，第二次
          # install 只按自己的约束挑版本，会把 numba 声明的 numpy 上界
          # （例如 0.60 的 numpy<2.1）踩掉，装出的环境不再是可运行组合。
          pip install -e ".[dev,viz,planning]" "${{ matrix.numpy }}"
      - name: Verify numpy major version
        env:
          NUMPY_ARM: ${{ matrix.numpy }}
        # 装成功不等于装到了想要的档位：pip 只会给约束以内的最新版，
        # 矩阵值写松了（把 "numpy<2" 写成 "numpy<3"）上面一步照样绿。
        run: |
          python -c 'import os, sys
          import numpy
          arm = os.environ["NUMPY_ARM"]
          want = "1" if arm == "numpy<2" else "2"
          got = numpy.__version__.split(".")[0]
          print(f"numpy {numpy.__version__} (arm {arm})")
          sys.exit(0 if got == want else f"numpy {numpy.__version__} 与档位 {arm} 不符")'
      - name: Test
        run: pytest -q

  # 跨平台：同一套测试在 macOS / Windows 上真跑，给 pyproject 的
  # `Operating System :: OS Independent` 一个实测依据（此前只有 ubuntu 跑过）。
  # 平台差异与解释器小版本无关 ⇒ 只取 3.12 一档，不把上面的 matrix 铺成 4×3。
  # PYTHONUTF8=1 不是保险丝而是必需品：Windows 上被重定向的 stdout 会退回 ANSI
  # 代码页（cp1252），而 CLI 的 --help / 错误信息是中文 —— 子进程 print 会
  # UnicodeEncodeError，父进程 text=True 也会按 cp1252 解码（tests/test_cli.py
  # 就断言 `"200 步" in proc.stdout`）。两边都用 UTF-8 才谈得上"跑同一套测试"。
  test-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # 矩阵值必须是数组（或单个 ${{ }} 表达式）：写成 "3.12" 标量会让
        # **整份 workflow 失效**，run 直接 0 job 失败，而不是这条 job 报错。
        python-version: ["3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,planning]"
      # windows 的默认 shell 是 pwsh：`run:` 的引号 / 退出码语义与 bash 不同，
      # 显式钉死 shell 才能保证三地跑的是同一行命令。
      - name: Test
        shell: bash
        run: pytest -q

  # 核心安装（只 dev，没有 matplotlib / numba）：证明 pip install chassis-sim
  # 的用户不会红。render 四模块应 importorskip 掉，planning 走容差档；
  # 闸门就是 pytest 的退出码 —— skip 不算失败，failed 一定让这一步红。
  core-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core only, 无 viz / 无 planning)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # 静态检查固定一个 Python 档（3.12）：ruff / mypy 的结论应与解释器版本无关，
  # 规则集本身用 target-version = "py310" 声明语言下限。版本都钉死，避免上游
  # 新增规则让 PR 莫名变红（升级 ruff / mypy 应是独立的一个 PR）。
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.17.3"
      # 规则集见 pyproject.toml 的 [tool.ruff.lint]；未选中的族在注释里逐条
      # 记着实测报错数量，属于"补齐后再开"，不是默认关掉。
      - name: ruff check
        run: ruff check .
      # 只报告不修：仓库现码已是 88 列格式，这一步防回退。
      - name: ruff format --check
        run: ruff format --check .

  # 类型检查的入口清单写在 pyproject.toml 的 [tool.mypy] files = [...]，
  # 所以这里不带路径参数；扩围只改 pyproject，不改 workflow。
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy and typed runtime deps
        # mypy / types-PyYAML 由 dev extra 钉死（pyproject.toml），不再单独
        # pip install —— 否则本地 .[dev] 与 CI 装的不是同一套版本。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        env:
          MYPYPATH: src
        run: python -m mypy

  # 覆盖率单独一个 job 而不是塞进 test 的 3.12 一档：test 的 matrix 只证明
  # "四档 Python 都绿"，混入覆盖率会让 3.12 一档多背一条独立的红/绿判据，
  # 定位变难；单独 job 的耗时与 3.12 档重叠，实际不增加关键路径。
  # fail_under 的权威值在 pyproject.toml [tool.coverage.report]，命令里再写一遍
  # 是为了在 PR 的失败日志里直接看到门槛数字。
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # pytest-cov 由 dev extra 钉死（pyproject.toml），不再单独安装。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,planning]"
      - name: Test with coverage gate
        run: pytest -q --cov --cov-report=term:skip-covered --cov-fail-under=82

  # README 的 python 代码块是文档里唯一能被机器验证的部分：脚本把两份 README
  # 里的每个 python 围栏块在独立子进程里真跑一遍（不是语法检查），块首行写
  # `# no-exec` 才跳过，语义见 CONTRIBUTING.md —— 跳过要写理由，跑不过不许
  # 写成跳过。块里会 import numba / matplotlib，所以这里装全量 extras。
  # README 正在被重写：新 README 不需要改这个 job，也不需要改脚本，
  # 块数变化与失败项会直接出现在这一步的日志里。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,planning]"
      - name: Run README python blocks
        run: python tools/check_readme_blocks.py
